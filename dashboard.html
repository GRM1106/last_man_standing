<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Your Last Man Standing tournament dashboard.">
  <title>Last Man Standing — Dashboard</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="dashboard-layout.css">
</head>
<body>
  <main class="shell">
    <nav><a class="brand" href="/dashboard.html"><b>LMS</b><span>Last Man Standing</span></a><div class="admin-nav"><div id="account-identity" class="account-identity" hidden><strong id="account-name">Player</strong><small id="account-email"></small></div><a id="admin-link" class="dashboard-admin-link" href="/admin.html" hidden>Admin</a><button id="sign-out" class="nav-button" type="button">Sign out</button></div></nav>
    <section id="dashboard-loading" class="dashboard-state"><p class="label">PLAYER DASHBOARD</p><h1>Loading your pot…</h1></section>
    <section id="dashboard-empty" class="dashboard-state" hidden><p class="label">PLAYER DASHBOARD</p><h1>You’re registered.<br><em>Stay tuned.</em></h1><p class="intro">You haven’t been assigned to an active pot yet.</p></section>
    <section id="dashboard-content" class="dashboard" hidden>
      <header class="dashboard-heading"><div><p class="label">PLAYER DASHBOARD</p><h1 id="dashboard-greeting">Last Man Standing 26/27 Pots</h1></div><div class="live-mark"><span></span><b id="pot-count" class="pot-count-label">0 pots</b></div></header>
      <p id="dashboard-message" class="admin-message" role="status"></p>
      <div id="dashboard-pots" class="dashboard-pots"></div>
    </section>
  </main>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
